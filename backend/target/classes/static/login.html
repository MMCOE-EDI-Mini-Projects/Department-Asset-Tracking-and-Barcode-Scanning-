<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Department Asset Tracking System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: #f8fafc;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: var(--shadow-lg);
        }
        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-logo {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: var(--primary);
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        .login-logo svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        .quick-roles {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        .quick-roles-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .roles-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
    </style>
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            </div>
            <h1 style="font-family: var(--font-heading); font-size: 20px; font-weight: 700; color: var(--text-primary);">Department AssetHub</h1>
            <p style="color: var(--text-secondary); font-size: 13px; margin-top: 3px;">Sign in to your institutional account</p>
        </div>

        <form id="loginForm">
            <div class="form-group" style="margin-bottom: 14px;">
                <label class="form-label" for="email">Institutional Email</label>
                <input type="email" id="email" class="form-input" placeholder="admin@mmcoe.edu" required autocomplete="username">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 14px;">
                Sign In to Portal
            </button>
        </form>

        <div class="quick-roles">
            <div class="quick-roles-title">Demo Role Quick Select</div>
            <div class="roles-buttons">
                <button type="button" class="btn btn-secondary btn-sm" onclick="setCredentials('admin@mmcoe.edu', 'Admin@123')">
                    Admin
                </button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="setCredentials('depthead@mmcoe.edu', 'DeptHead@123')">
                    Dept Head
                </button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="setCredentials('staff@mmcoe.edu', 'Staff@123')">
                    Staff
                </button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function setCredentials(email, pw) {
            document.getElementById("email").value = email;
            document.getElementById("password").value = pw;
        }

        if (Auth.getUser() && Auth.getToken()) {
            window.location.href = "index.html";
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btnSubmit");
            btn.disabled = true;
            btn.innerText = "Signing in…";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const res = await API.post("/api/auth/login", { email, password });
                if (res.ok) {
                    Auth.setUser(res.user, res.token);
                    showToast("Login successful. Redirecting...", "success");
                    setTimeout(() => window.location.href = "index.html", 400);
                }
            } catch (err) {
                showToast(err.message || "Invalid credentials", "error");
                btn.disabled = false;
                btn.innerText = "Sign In to Portal";
            }
        });
    </script>
</body>
</html>
