server.port=8080

spring.application.name=asset-tracking-backend

spring.datasource.url=jdbc:mysql://localhost:3306/asset_tracking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=vedant
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Serve static frontend files from resources/static
spring.web.resources.static-locations=classpath:/static/

spring.jackson.serialization.fail-on-empty-beans=false
