<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Login</title>
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav id="nav"></nav>
<main>
<h1>Login</h1>
<div id="msg" class="banner"></div>
<form id="loginForm" class="form-card">
  <label for="email">Email</label>
  <input type="email" id="email" placeholder="depthead@mmcoe.edu" required>
  <label for="password">Password</label>
  <input type="password" id="password" required>
  <button type="submit" class="btn-primary">Log In</button>
</form>
<p style="font-size:13px">Test accounts: admin@mmcoe.edu / Admin@123 (asset_admin) &middot; depthead@mmcoe.edu / DeptHead@123 (dept_head, can approve) &middot; staff@mmcoe.edu / Staff@123 (staff, view only)</p>
</main>
<script src="nav.js"></script><script src="js/api.js"></script>
<script>
renderNav("login.html");
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  try {
    const result = await apiLogin(document.getElementById("email").value, document.getElementById("password").value);
    localStorage.setItem("token", result.token);
    localStorage.setItem("userName", result.user.name);
    localStorage.setItem("roleName", result.user.role_name);
    location.href = "index.html";
  } catch (err) {
    msg.className = "banner visible banner-error";
    msg.textContent = err.message;
  }
});
</script>
</body></html>
