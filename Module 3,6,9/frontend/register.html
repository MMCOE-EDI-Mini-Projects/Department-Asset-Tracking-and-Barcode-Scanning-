<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register Asset</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <span class="navbar-title">Department Asset Tracking</span>
    <div class="navbar-links">
      <a href="index.html">Dashboard</a>
      <a href="register.html">Register</a>
      <a href="identify.html">Identify</a>
      <a href="disposal.html">Disposal Requests</a>
    </div>
  </nav>
  <main>
    <h1>Asset Registration</h1>

    <div id="msg" class="banner"></div>

    <form id="registerForm" class="form-card">
      <label for="assetCode">Asset Code</label>
      <input type="text" id="assetCode" placeholder="CE-LAB3-042" required />

      <label for="name">Asset Name</label>
      <input type="text" id="name" placeholder="Dell OptiPlex" required />

      <label for="category">Category</label>
      <input type="text" id="category" placeholder="Desktop" required />

      <label for="department">Department</label>
      <select id="department" required></select>

      <label for="location">Location</label>
      <select id="location" required></select>

      <label for="make">Make</label>
      <input type="text" id="make" placeholder="Dell" required />

      <label for="model">Model</label>
      <input type="text" id="model" placeholder="OptiPlex 7090" required />

      <label for="serialNumber">Serial Number</label>
      <input type="text" id="serialNumber" placeholder="DELL12345" required />

      <label for="purchaseDate">Purchase Date</label>
      <input type="date" id="purchaseDate" required />

      <label for="condition">Condition</label>
      <select id="condition">
        <option value="new">New</option>
        <option value="good" selected>Good</option>
        <option value="fair">Fair</option>
        <option value="damaged">Damaged</option>
        <option value="poor">Poor</option>
      </select>

      <button type="submit" class="btn-primary">Register Equipment</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
