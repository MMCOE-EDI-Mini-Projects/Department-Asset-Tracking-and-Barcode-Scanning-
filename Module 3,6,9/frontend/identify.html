<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Identify Asset</title>
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav id="nav"></nav>
<main>
<h1>Asset Identification</h1>
<div id="msg" class="banner"></div>
<form id="searchForm" class="form-card"><h3>Option A: Manual Asset Code Entry</h3>
  <input type="text" id="assetCode" placeholder="CE-LAB3-042"><button type="submit" class="btn-primary">Search Asset</button></form>
<form id="ocrForm" class="form-card"><h3>Option B: Image Upload (OCR)</h3>
  <input type="file" id="imageInput" accept="image/*"><button type="submit" id="ocrButton" class="btn-primary">Upload Asset Code Image</button>
  <p id="extractedCode" style="font-size:13px"></p></form>
<div id="resultCard" class="form-card" style="display:none">
  <h3>Asset Details</h3><table id="resultTable"></table>
  <div style="margin-top:16px">
    <button id="showDisposalBtn" class="btn-danger">Request Disposal / Write-off</button>
    <form id="disposalForm" style="display:none;margin-top:16px">
      <label>Request Type</label>
      <select id="requestType" style="margin-bottom:12px">
        <option value="disposal">Physical Disposal</option>
        <option value="write_off">Financial Write-off</option>
      </select>
      <label>Requested By</label><input type="text" id="requestedBy" required>
      <label>Reason</label><input type="text" id="reason" required>
      <label>Disposal / Write-off Method</label><input type="text" id="disposalMethod" required placeholder="e.g. Scrapped, Sold, Depreciation Write-off">
      <div id="bookValueGroup" style="display:none">
        <label>Book Value / Write-off Amount (optional)</label>
        <input type="number" step="0.01" id="bookValue" placeholder="0.00">
      </div>
      <label>Remarks (optional)</label><textarea id="remarks"></textarea>
      <button type="submit" class="btn-danger">Submit Request</button>
      <p id="disposalMsg" style="font-size:13px;margin-top:8px"></p>
    </form>
  </div>
</div>
</main>
<script src="nav.js"></script><script src="js/api.js"></script>
<script>
renderNav("identify.html");
let currentAssetCode = null;
function statusPill(s){
  if (s==='disposed') return `<span class="pill pill-success">disposed</span>`;
  if (s==='written_off') return `<span class="pill pill-warning" style="background:#fff3cd;color:#856404;border:1px solid #ffeeba">written_off</span>`;
  return `<span class="pill pill-info">${s}</span>`;
}
function renderAsset(a) {
  currentAssetCode = a.asset_code;
  const rows = [["Asset Code",a.asset_code],["Name",a.name],["Category",a.category],["Make",a.make],["Model",a.model],["Serial Number",a.serial_number],["Condition",a.asset_condition],["Status",statusPill(a.status)]];
  document.getElementById("resultTable").innerHTML = rows.map(([l,v])=>`<tr><td>${l}</td><td>${v||"-"}</td></tr>`).join("");
  document.getElementById("resultCard").style.display = "block";
  document.getElementById("disposalForm").style.display = "none";
  const isInactive = a.status==="disposed" || a.status==="written_off";
  document.getElementById("showDisposalBtn").style.display = isInactive ? "none" : "inline-block";
}
document.getElementById("requestType").addEventListener("change", (e) => {
  document.getElementById("bookValueGroup").style.display = e.target.value === "write_off" ? "block" : "none";
});
document.getElementById("searchForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try { renderAsset(await apiSearchAssetByCode(document.getElementById("assetCode").value)); }
  catch (err) { document.getElementById("msg").className="banner visible banner-error"; document.getElementById("msg").textContent=err.message; document.getElementById("resultCard").style.display="none"; }
});
document.getElementById("ocrForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const file = document.getElementById("imageInput").files[0]; if (!file) return;
  const btn = document.getElementById("ocrButton"); btn.disabled = true; btn.textContent = "Running OCR...";
  try {
    const result = await apiSearchAssetByImage(file);
    document.getElementById("extractedCode").textContent = `OCR extracted: ${result.extractedCode}`;
    renderAsset(result.asset);
  } catch (err) { document.getElementById("msg").className="banner visible banner-error"; document.getElementById("msg").textContent=err.message; }
  finally { btn.disabled=false; btn.textContent="Upload Asset Code Image"; }
});
document.getElementById("showDisposalBtn").addEventListener("click", () => {
  document.getElementById("disposalForm").style.display = "block";
  document.getElementById("showDisposalBtn").style.display = "none";
});
document.getElementById("disposalForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const dm = document.getElementById("disposalMsg");
  const reqType = document.getElementById("requestType").value;
  const bv = document.getElementById("bookValue").value;
  try {
    const r = await apiRequestDisposal({
      assetCode: currentAssetCode,
      requestedBy: document.getElementById("requestedBy").value,
      reason: document.getElementById("reason").value,
      disposalMethod: document.getElementById("disposalMethod").value,
      remarks: document.getElementById("remarks").value,
      requestType: reqType,
      bookValue: bv
    });
    dm.style.color = "var(--color-success-text)";
    dm.textContent = `Request submitted (${r.request_type || reqType}). Status: ${r.status}`;
  } catch (err) { dm.style.color = "var(--color-error-text)"; dm.textContent = err.message; }
});
</script>
</body></html>
