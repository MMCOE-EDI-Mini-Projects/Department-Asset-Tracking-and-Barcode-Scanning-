<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Identify Asset</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <span class="navbar-title">Department Asset Tracking</span>
    <div class="navbar-links">
      <a href="index.html">Dashboard</a>
      <a href="register.html">Register</a>
      <a href="identify.html">Identify</a>
      <a href="disposal.html">Disposal Requests</a>
    </div>
  </nav>
  <main>
    <h1>Asset Identification</h1>

    <div id="msg" class="banner"></div>

    <form id="searchForm" class="form-card">
      <h3>Option A: Manual Asset Code Entry</h3>
      <input type="text" id="assetCode" placeholder="CE-LAB3-042" />
      <button type="submit" class="btn-primary">Search Asset</button>
    </form>

    <form id="ocrForm" class="form-card">
      <h3>Option B: Image Upload (OCR)</h3>
      <input type="file" id="imageInput" accept="image/*" />
      <button type="submit" id="ocrButton" class="btn-primary">Upload Asset Code Image</button>
      <p id="extractedCode" style="font-size: 13px; color: var(--color-text-secondary);"></p>
    </form>

    <div id="resultCard" class="form-card" style="display: none;">
      <h3>Asset Details</h3>
      <table id="resultTable"></table>

      <div id="disposalSection" style="margin-top: 16px;">
        <button id="showDisposalBtn" class="btn-danger">Request Disposal</button>

        <form id="disposalForm" style="display: none; margin-top: 16px;">
          <label for="requestedBy">Requested By</label>
          <input type="text" id="requestedBy" placeholder="Your name" required />

          <label for="reason">Disposal Reason</label>
          <input type="text" id="reason" placeholder="e.g. End of useful life" required />

          <label for="disposalMethod">Disposal Method</label>
          <input type="text" id="disposalMethod" placeholder="e.g. Scrap, Donation" required />

          <label for="remarks">Remarks (optional)</label>
          <textarea id="remarks"></textarea>

          <button type="submit" class="btn-danger">Submit Disposal Request</button>
          <p id="disposalMsg" style="font-size: 13px; margin-top: 8px;"></p>
        </form>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/identify.js"></script>
</body>
</html>
